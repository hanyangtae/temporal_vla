# DreamVLA Calvin (dynamic + depth + sam_feat 헤드 있는 변형) — 로컬 체크포인트.
# 기존 scripts/serve/dreamvla.py 의 하드코딩된 동작을 프로파일로 추출해 재현.
#
# /act 는 history queue (sequence_length=10) 를 채우며 매 호출마다 단일 action 1개를 emit.
# action_pred_steps=3 은 모델 내부 prediction depth 이고, serve 가 noise-free 1 step 만
# 골라 반환하는 패턴이라 n_action_steps 는 1.

name: dreamvla__calvin_dynamic_depth_semantic
base_model: dreamvla
checkpoint_source:
  type: local
  id: /cache/checkpoints/dreamvla/dreamvla_dynamic_depth_semantic-001.pth
compatible_benchmarks: [calvin]

action_type: relative
action_layout:
  - {name: eef_pos,   dims: 3}
  - {name: eef_euler, dims: 3}
  - {name: gripper,   dims: 1}
rotation_encoding: euler
gripper_encoding:
  range: "[-1,1]"                  # serve 에서 sigmoid → >0.5 → (-1, 1) 이산화 후 emit
  binarize: false                  # 이미 serve 에서 이산화 완료. processor 는 추가 처리 안 함.
  sign_flip: false
  threshold: 0.0

# DreamVLA 는 raw action 을 그대로 출력 (내부 정규화 없음).
normalization:
  scheme: none
  stats_file: null
  key_selection: []

observation_requirements:
  images: [static, wrist]
  state: [eef_pos, eef_euler, gripper_action]
  # eef_euler 가 없으면 eef_quat 에서 변환,
  # gripper_action 이 없으면 gripper_qpos 임계값으로 fallback (serve 에서 처리).
  allow_conversions: [quat_to_euler, gripper_qpos_threshold]

n_action_steps: 1                  # 한 호출당 단일 action 1개 emit (history queue 사용)
image_preprocess:
  resolution: 224
  rotate_180: false
  center_crop: false

emits_subkeys:
  - action.eef_pos
  - action.eef_euler
  - action.gripper

# vit_checkpoint 외 나머지는 dreamvla DreamVLA() 생성자 인자에 그대로 전달.
model_specific:
  vit_checkpoint: /cache/checkpoints/mae_pretrain_vit_base.pth
  precision: fp32                  # fp32 / fp16 / bf16
  sequence_length: 10              # history window
  history_len: 10                  # queue maxlen (= sequence_length)
  action_pred_steps: 3             # 모델 내부 multi-step prediction depth
  num_resampler_query: 16
  num_obs_token_per_image: 9
  image_size: 224
  patch_size: 16
  transformer_layers: 24
  hidden_dim: 1024
  transformer_heads: 16
  obs_pred: true
  depth_pred: true
  sam_feat_pred: true
  use_dit_head: true
  pred_num: 1
  attn_implementation: sdpa
  dit_type: DiT-B
  phase: evaluate
  atten_goal: 0
