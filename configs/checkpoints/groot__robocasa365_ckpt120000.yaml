# GR00T N1.6 RoboCasa365 checkpoint-120000.
# User-facing config name follows the dataset/checkpoint. The internal
# embodiment_tag follows checkpoint metadata and selects the processor branch.

name: groot__robocasa365_ckpt120000
base_model: groot
checkpoint_source:
  type: local
  id: /temporal_vla/outputs/checkpoints/grootn16_robocasa365_multitask_learning/checkpoint-120000
compatible_benchmarks: [robocasa]

action_type: relative
action_layout:
  - {name: eef_pos,        dims: 3}
  - {name: eef_axisangle,  dims: 3}
  - {name: gripper,        dims: 1}
rotation_encoding: axisangle
gripper_encoding:
  range: "[-1,1]"
  binarize: false
  sign_flip: false
  threshold: 0.0

normalization:
  scheme: none
  stats_file: null
  key_selection: []

observation_requirements:
  images: [side_0, side_1, wrist_0]
  state: [eef_pos, eef_quat, gripper_qpos, joint_pos]
  allow_conversions: []

n_action_steps: 16
image_preprocess:
  resolution: 256
  rotate_180: false
  center_crop: false

emits_subkeys:
  - action.eef_pos
  - action.eef_axisangle
  - action.gripper
  - action.base_motion
  - action.control_mode

model_specific:
  embodiment_tag: NEW_EMBODIMENT
  no_strict: false
  device: cuda
