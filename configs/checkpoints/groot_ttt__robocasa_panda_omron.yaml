# GR00T N1.6-3B + TTT predictor (Phase 1 학습 가중치) 로 RoboCasa PandaOmron 서빙.
# 베이스 ckpt 는 finetune 결과물 (Stage 2 launch_finetune_ttt.py 출력) 또는 pretrain
# ckpt 둘 다 가능. 차이는 model_specific.predictor_path 가 채워지는 것뿐.
#
# serve 측: scripts/serve/groot.py 가 model_specific.predictor_path 를 보고
# 로드된 Gr00tN1d6 를 Gr00tN1d6WithTTT 로 in-place 승격.
# video 키 매핑은 modality_configs 에서 동적 추론되므로 finetune 후 컨벤션
# (robot0_agentview_*) 자동 흡수.

name: groot_ttt__robocasa_panda_omron
base_model: groot
checkpoint_source:
  type: local
  # 기본은 finetune 결과 디렉토리. 미평가 단계에서는 pretrain ckpt 그대로 +
  # predictor 만 붙여 디버깅 가능.
  id: /temporal_vla/outputs/groot_ttt_robocasa_10tasks
compatible_benchmarks: [robocasa]

action_type: relative
action_layout:
  - {name: eef_pos,        dims: 3}
  - {name: eef_axisangle,  dims: 3}
  - {name: gripper,        dims: 1}
rotation_encoding: axisangle
gripper_encoding:
  range: "[-1,1]"
  binarize: false
  sign_flip: false
  threshold: 0.0

normalization:
  scheme: none
  stats_file: null
  key_selection: []

observation_requirements:
  # do-dong-park modality config (ROBOCASA_PANDA_OMRON 재등록 후) 기준.
  images: [robot0_agentview_left, robot0_agentview_right, robot0_eye_in_hand]
  state: [eef_pos_rel, eef_quat_rel, gripper_qpos, base_position, base_rotation]
  allow_conversions: []

n_action_steps: 16
image_preprocess:
  resolution: 256
  rotate_180: false
  center_crop: false

emits_subkeys:
  - action.eef_pos
  - action.eef_axisangle
  - action.gripper
  - action.base_motion
  - action.control_mode

model_specific:
  embodiment_tag: ROBOCASA_PANDA_OMRON
  no_strict: true                     # TTT wrapper 가 base ckpt 키와 부분 mismatch 가능
  device: cuda

  # TTT 옵션 — 비우면 baseline GR00T (이 프로파일이 그냥 pretrain ckpt 평가용).
  predictor_path: /temporal_vla/outputs/train/phase1_groot_robocasa/latest/phase1_final.pt
  predictor_input_dim: 2048
  predictor_proj_dim: 2048
  predictor_inner_model: linear
  predictor_eta_base: 0.1
