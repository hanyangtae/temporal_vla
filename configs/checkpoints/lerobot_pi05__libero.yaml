# pi0.5 LIBERO — lerobot 공식 finetuned 체크포인트 (HF: lerobot/pi05_libero_finetuned).
# lerobot-native 포맷(config.json + model.safetensors + policy_pre/postprocessor.json):
# serve 는 from_pretrained + make_pre_post_processors(pretrained_path=repo) 로 로드,
# de-normalization 은 repo 의 postprocessor 가 자체 수행 → profile normalization=none.

name: lerobot_pi05__libero
base_model: lerobot
checkpoint_source:
  type: hf_repo
  id: lerobot/pi05_libero_finetuned
compatible_benchmarks: [libero]

action_type: relative              # LIBERO delta EEF
action_layout:
  - {name: eef_pos,       dims: 3}
  - {name: eef_axisangle, dims: 3}
  - {name: gripper,       dims: 1}
rotation_encoding: axisangle
gripper_encoding:
  range: "[-1,1]"                  # pi05 continuous 출력
  binarize: false                  # LIBERO ActionProcessor 측에서 처리
  sign_flip: false
  threshold: 0.0

# lerobot 내부 processor(postprocessor.json)가 de-norm 수행 → serve 는 stats 불필요.
normalization:
  scheme: none
  stats_file: null
  key_selection: []

# pi05 LIBERO state = [eef_pos(3), eef_axisangle(3), gripper_qpos(2)] = 8D
# (lerobot LiberoProcessorStep 와 동일). LIBERO obs processor 는 eef_quat 을 보내고
# serve 가 quat_to_axisangle 변환 후 조립.
observation_requirements:
  images: [static, wrist]
  state: [eef_pos, eef_axisangle, gripper_qpos]
  allow_conversions: [quat_to_axisangle]

n_action_steps: 10                 # OpenPI/lerobot LIBERO 재현 기준 (체크포인트 기본 50 override)
image_preprocess:
  resolution: 256                  # LIBERO native; lerobot preprocessor 가 재조정
  rotate_180: true                 # pi05_libero 는 180° 회전 이미지로 학습 (lerobot LiberoProcessorStep 동일). serve 가 flip 수행.
  center_crop: false

emits_subkeys:
  - action.eef_pos
  - action.eef_axisangle
  - action.gripper

model_specific:
  policy_type: pi05
