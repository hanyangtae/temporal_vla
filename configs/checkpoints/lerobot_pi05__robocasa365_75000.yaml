# pi0.5 RoboCasa365 (openpi→LeRobot 변환, step 75000) — 로컬 체크포인트
#   /cache/checkpoints/pi05-robocasa-75000-lerobot
#     config.json (input_features 에 camera 없음 — 변환 아티팩트)
#     model.safetensors (16G)
#     norm_stats.json (openpi 포맷: mean/std 만, q01/q99=null)
#
# 온보딩 발견사항 단일 출처:
#   .claude/agent-memory/vla-checkpoint-manager/pi05_robocasa_quirks.md
#
# pi.py external_config 경로가 필요한 이유 (quirks §1~3):
#   1. config.json input_features 에 camera key 없음 → camera_keys dict 선언으로
#      _force_external=True 강제 (config.json 있어도 external 로딩 경로 사용).
#   2. config.json normalization_mapping=QUANTILES 이지만 norm_stats 는 mean/std 만
#      → pi.py 가 QUANTILES→MEAN_STD 자동 override. norm_stats.json 은 rglob 자동 로드.
#   3. config.json dtype=float32 는 RTX 4070Ti 16GB 에서 OOM → dtype=bfloat16 강제.
# external 경로는 config.json 을 무시하고 PI05Config() 기본값을 쓴다. 기본값이
# 이 체크포인트와 완전 일치함을 확인: gemma_2b / gemma_300m / chunk 50 /
# max_state_dim 32 / max_action_dim 32 / num_inference_steps 10 / 224x224 / empty_cameras 0.

name: lerobot_pi05__robocasa365_75000
base_model: lerobot
checkpoint_source:
  type: local
  id: /cache/checkpoints/pi05-robocasa-75000-lerobot
compatible_benchmarks: [robocasa]

# use_relative_actions=false (config.json) + robosuite OSC_POSE absolute.
action_type: absolute
# 모델은 32D(max_action_dim) 를 내보내지만 앞 12D 만 의미 (RobocasaOutputs[:12], quirks §8).
# 나머지 [12:32] 는 pad → emit 하지 않음.
action_layout:
  - {name: eef_pos,       dims: 3}   # [0-2]
  - {name: eef_axisangle, dims: 3}   # [3-5]  robosuite OSC_POSE axis-angle 슬롯
  - {name: gripper,       dims: 1}   # [6]    [-1,1] continuous
  - {name: base_motion,   dims: 4}   # [7-10] vx, vy, w, torso
  - {name: control_mode,  dims: 1}   # [11]   PandaMobile base_mode
rotation_encoding: axisangle
gripper_encoding:
  range: "[-1,1]"                    # pi05 continuous. RoboCasaActionProcessor 가 그대로 통과(threshold 없음).
  binarize: false
  sign_flip: false
  threshold: 0.0

# pi0.5 는 QUANTILES([q01,q99]→[-1,1]) 로 학습됨 (PI05Config 기본 normalization_mapping).
# 원본 norm_stats.json 은 q01/q99=null (mean/std 만) → pi.py 가 QUANTILES→MEAN_STD 로 무조건 치환
#   (pi.py:111-117). 역정규화 스케일이 (q99-q01)/2=2.326·std 대신 std → action·state ~2.326배 undershoot.
# QUANTILES 로 교정: (1) norm_stats.json 에 q01/q99 Gaussian 근사(mean∓2.326·std) patch(호스트, 원본 백업),
#   (2) external_config.normalization_mapping 명시 → pi.py MEAN_STD 치환 우회(cfg 기본 QUANTILES 유지).
# ⚠️ 결과(2026-07-25 실측): undershoot 는 실재·교정됨(action 2.3배↑, eef_pos peak 1.56 clip 확인)했으나
#   **OpenDrawer SR 여전히 0/10** — 정규화는 SR=0 의 충분원인 아님. 모델이 해당 scene 에서 저-commit
#   (action |mean| 0.082, arm 0.05m/60step). QUANTILES 자체는 아키텍처상 정답이라 유지.
#   정밀 교정은 openpi 원본 q01/q99 필요(현 인프라 부재, 별도 추적). 다음 후보: action_type·camera slot·scene OOD.
normalization:
  scheme: q01_q99
  stats_file: norm_stats.json      # q01/q99 patched (Gaussian 근사). 원본 백업=norm_stats.json.orig
  key_selection: []

# 학습 state(16D, quirks §4): [base_to_eef_pos(3), base_to_eef_quat(4, xyzw),
#   base_pos(3), base_quat(4, xyzw), gripper_qpos(2)] → 16D.
# _apply_input_remap 가 max_state_dim(32) 까지 zero-pad (openpi pad_to_dim 동일).
# RoboCasaObsProcessor 가 robot0_base_to_eef_pos/_quat 를 직접 emit → world-frame fallback 불필요.
observation_requirements:
  images: [base_0_rgb, left_wrist_0_rgb, right_wrist_0_rgb]
  state: [base_to_eef_pos, base_to_eef_quat, base_pos, base_quat, gripper_qpos]
  allow_conversions: []

n_action_steps: 16                  # chunk 50 예측 중 16 실행 후 재계획 (≤ chunk_size). closed-loop 균형.
image_preprocess:
  resolution: 224                   # config image_resolution [224,224]. robosuite square render → resize 왜곡 없음.
  rotate_180: false                 # robocasa 는 회전 없음 (LIBERO 전용 규칙).
  center_crop: false                # pi05 는 내부 resize_with_pad 사용.

emits_subkeys:
  - action.eef_pos
  - action.eef_axisangle
  - action.gripper
  - action.base_motion              # → RoboCasaActionProcessor base(vx,vy,w)+torso
  - action.control_mode             # → PandaMobile base_mode (quirks §8 SR=0 fix, robocasa.py:149)

model_specific:
  policy_type: pi05
  # config.json 에 camera 없음 → external_config.camera_keys 로 _force_external.
  # camera_keys = {통일API src key → pi05 model input_features key}.
  # dict 삽입 순서 = input_features(=image token) 순서 → openpi 표준 슬롯 순서:
  #   base_0_rgb, left_wrist_0_rgb, right_wrist_0_rgb.
  # robosuite 3카메라(agentview_left/right, eye_in_hand) → RoboCasaObsProcessor(--three-cameras)가
  #   observation.images.left / .right / .wrist alias 로 emit.
  # slot↔camera: openpi single-arm 관례를 따라 THE 손목(eye_in_hand)을 left_wrist_0_rgb 슬롯에,
  #   외부뷰 2개(agentview_left/right)를 base_0_rgb / right_wrist_0_rgb 에 배치.
  #   (LIBERO single-Franka 관례 = base(exterior)+left_wrist(wrist) 확장.)
  #   ⚠️ SR 미검증: 이 mapping 도 대안(wrist→right_wrist_0_rgb)도 OpenDrawer SR=0.
  #      둘 다 task-conditioned 대형 action 은 생성(serve 검증됨). 정확한 slot 대응은
  #      SR>0 task 로 재확정 필요 (convert 스크립트/학습 dataset info.json 부재).
  external_config:
    image_shape: [3, 224, 224]
    state_shape: [32]
    action_shape: [32]
    dtype: bfloat16
    # non-None → pi.py 의 QUANTILES→MEAN_STD 무조건 치환을 skip (cfg 기본값 QUANTILES 유지).
    # 값 자체는 pi.py 가 cfg 에 적용하지 않지만(skip 만 담당), 문서용으로 학습 설정 명시.
    normalization_mapping: {VISUAL: IDENTITY, STATE: QUANTILES, ACTION: QUANTILES}
    camera_keys:
      observation.images.left:  observation.images.base_0_rgb
      observation.images.wrist:  observation.images.left_wrist_0_rgb
      observation.images.right:  observation.images.right_wrist_0_rgb
