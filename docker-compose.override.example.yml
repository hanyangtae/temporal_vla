services:
  vla_dev:
    # --- [Option 1] PC 2 (Dev) & PC 1 (Data/Eval) Setup ---
    # GUI Support + Single/Full GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all          # Use all available GPUs
              capabilities: [gpu]
    
    environment:
      - DISPLAY=${DISPLAY}        # Forward Host Display
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
      - QT_X11_NO_MITSHM=1
      - HF_HOME=/temporal_vla/data/huggingface  # HF 모델/데이터 캐시 경로 변경
      - LIBERO_DATA_DIR=/temporal_vla/data/libero # LIBERO 데이터 경로

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw  # X11 Socket for GUI
