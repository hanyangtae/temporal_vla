# ================================================================
# [SSH 원격 접속 사용자용] docker-compose.override.yml 템플릿
# ================================================================
# 사용법: cp docker-compose.override.example.yml docker-compose.override.yml
#
# VNC 웹 브라우저 접속: https://<서버IP>:8444
# 컨테이너 시작 후 VNC가 자동으로 실행됩니다.
# ================================================================

services:
  robocasa:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

    # Shared Memory 제한 해제 (Host 메모리 공유)
    ipc: host

    # KasmVNC 웹 접속 포트
    ports:
      - "8444:8444"

    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=0
      # - WANDB_API_KEY=${WANDB_API_KEY}
      - PYTHONPATH=/temporal_vla/robocasa:/temporal_vla/robosuite
      - DISPLAY=:1              # VNC 내부 가상 디스플레이
      - VNC_PW=${VNC_PW}        # .env 파일에서 설정

    # 컨테이너 시작 시 VNC 서버 자동 실행
    command: ["/bin/bash", "/temporal_vla/scripts/start_vnc.sh"]

  xvla:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    ipc: host
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=0

  dreamvla:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    ipc: host
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=0
