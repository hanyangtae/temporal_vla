# ================================================================
# [로컬 우분투 PC 직접 사용자용] docker-compose.override.yml 템플릿
# ================================================================
# 사용법: cp docker-compose.override.local.example.yml docker-compose.override.yml
#
# 컨테이너 내 GUI 앱이 호스트 화면에 바로 표시됩니다.
#
# 사전 준비 (호스트에서 한 번만 실행):
#   xhost +local:docker
# ================================================================

services:
  robocasa:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

    # Shared Memory 제한 해제 (Host 메모리 공유)
    ipc: host

    # 호스트 X11 소켓 마운트 → GUI 앱이 호스트 화면에 직접 출력
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=0
      # - WANDB_API_KEY=${WANDB_API_KEY}
      - PYTHONPATH=/temporal_vla:/temporal_vla/src/benchmarks/robocasa:/temporal_vla/src/benchmarks/robosuite:/temporal_vla/scripts/utils
      - DISPLAY=${DISPLAY}      # .env 파일에서 설정 (보통 :0 또는 :1)

  xvla:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    ipc: host
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=0

  dreamvla:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    ipc: host
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=0
