services:
  vla_dev:
    container_name: vla_container
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_NAME: ${USER_NAME}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    
    # Mount Workspace
    volumes:
      - .:/workspace/vla_tset:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw  # GUI support

    # Network
    network_mode: host

    # Keep container running
    tty: true
    stdin_open: true
    command: /bin/bash
