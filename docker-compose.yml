services:
  vla_dev:
    container_name: vla_container
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_NAME: ${USER_NAME}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    
    # Mount Workspace
    volumes:
      - .:/workspace/vla_tset:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw  # GUI support
    environment:
      - HF_HOME=/workspace/vla_tset/data/huggingface  # HF 모델/데이터 캐시 경로 변경
      - LIBERO_DATA_DIR=/workspace/vla_tset/data/libero # LIBERO 데이터 경로

    # Network
    network_mode: host

    # Keep container running
    tty: true
    stdin_open: true
    
    # Auto-setup environment on startup
    entrypoint: ["/bin/bash", "/workspace/vla_tset/scripts/setup_env.sh"]
    command: ["/bin/bash"]
