services:
  robocasa:
    container_name: robocasa
    build:
      context: ./docker/robocasa
      dockerfile: Dockerfile
      args:
        USER_NAME: ${USER_NAME}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}

    # Mount Workspace
    volumes:
      - .:/temporal_vla:rw
      # GUI 디스플레이 설정은 docker-compose.override.yml에서 환경에 맞게 구성
      # - 로컬 사용자: /tmp/.X11-unix 마운트 추가
      # - SSH 사용자: VNC 포트 노출
    environment:
      - HF_HOME=/temporal_vla/data/huggingface # HF 모델/데이터 캐시 경로 변경
      - LIBERO_DATA_DIR=/temporal_vla/data/libero # LIBERO 데이터 경로
      - PYTHONPATH=/temporal_vla:/temporal_vla/robocasa:/temporal_vla/robosuite:/temporal_vla/scripts/utils
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Network
    network_mode: host
    # ports:
    #   - "9990-9999:9990-9999"
    # Keep container running
    tty: true
    stdin_open: true

    # Auto-setup environment on startup
    # entrypoint: ["/bin/bash", "/temporal_vla/scripts/setup_env.sh"]
    command: ["/bin/bash"]

  # ── VLA Model Services ──────────────────────────────────────────
  # 독립 환경에서 학습/추론. 평가는 robocasa 컨테이너에서 HTTP로 요청.
  # 기본적으로 profiles를 사용해 수동 시작: docker compose --profile xvla up xvla

  xvla:
    container_name: xvla
    build:
      context: ./docker/xvla
      dockerfile: Dockerfile
      args:
        USER_NAME: ${USER_NAME}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    volumes:
      - .:/temporal_vla:rw
    environment:
      - HF_HOME=/temporal_vla/data/huggingface
    network_mode: host
    tty: true
    stdin_open: true
    command: ["/bin/bash"]

  dreamvla:
    container_name: dreamvla
    build:
      context: ./docker/dreamvla
      dockerfile: Dockerfile
      args:
        USER_NAME: ${USER_NAME}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    volumes:
      - .:/temporal_vla:rw
    environment:
      - HF_HOME=/temporal_vla/data/huggingface
      - PYTHONPATH=/temporal_vla/dreamvla
    network_mode: host
    tty: true
    stdin_open: true
    command: ["/bin/bash"]

  upvla:
    container_name: upvla
    build:
      context: ./docker/upvla
      dockerfile: Dockerfile
      args:
        USER_NAME: ${USER_NAME}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    volumes:
      - .:/temporal_vla:rw
    environment:
      - HF_HOME=/temporal_vla/data/huggingface
      - PYTHONPATH=/temporal_vla/upvla
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: host
    tty: true
    stdin_open: true
    command: ["/bin/bash"]
