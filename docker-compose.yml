services:
  robocasa:
    container_name: robocasa
    build:
      context: ./docker/robocasa
      dockerfile: Dockerfile
      args:
        USER_NAME: ${USER_NAME}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}

    # Mount Workspace
    volumes:
      - .:/temporal_vla:rw
      # GUI 디스플레이 설정은 docker-compose.override.yml에서 환경에 맞게 구성
      # - 로컬 사용자: /tmp/.X11-unix 마운트 추가
      # - SSH 사용자: VNC 포트 노출
    environment:
      - HF_HOME=/temporal_vla/data/huggingface # HF 모델/데이터 캐시 경로 변경
      - LIBERO_DATA_DIR=/temporal_vla/data/libero # LIBERO 데이터 경로
      - PYTHONPATH=/temporal_vla:/temporal_vla/src/benchmarks/robocasa:/temporal_vla/src/benchmarks/robosuite:/temporal_vla/scripts/utils
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Network
    network_mode: host
    # ports:
    #   - "9990-9999:9990-9999"
    # Keep container running
    tty: true
    stdin_open: true

    # Auto-setup environment on startup
    # entrypoint: ["/bin/bash", "/temporal_vla/scripts/setup_env.sh"]
    command: ["/bin/bash"]

  # ── LeRobot All-in-One ──────────────────────────────────────────
  # pi0, groot 통합 (transformers v5, lerobot PR #2964 이후 충돌 해소)

  lerobot:
    container_name: lerobot
    build:
      context: ./docker/lerobot
      dockerfile: Dockerfile
      args:
        USER_NAME: ${USER_NAME}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    volumes:
      - .:/temporal_vla:rw
      - /D/temporal_vla_data:/D/temporal_vla_data:rw
      # HF cache 는 NTFS(/D) 가 chmod 를 지원 안 해서 호스트 ext4 홈을 직접 bind mount.
      - ${HOME}/.cache/huggingface:/home/${USER_NAME}/.cache/huggingface:rw
    environment:
      - HF_HOME=/home/${USER_NAME}/.cache/huggingface
      - HF_TRUST_REMOTE_CODE=1
      - HF_TOKEN=${HF_TOKEN}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - PYTHONPATH=/temporal_vla:/temporal_vla/scripts/utils
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    command: ["/bin/bash"]

  # ── GR00T N1.6 Server (Isaac-GR00T 공식) ─────────────────────────
  # ZMQ 서버로 모델 서빙. robocasa 컨테이너에서 rollout_policy.py로 평가.

  groot:
    container_name: groot
    build:
      context: ./docker/groot
      dockerfile: Dockerfile
      args:
        USER_NAME: ${USER_NAME}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    volumes:
      - .:/temporal_vla:rw
      - /D/temporal_vla_data:/D/temporal_vla_data:rw
    environment:
      - HF_HOME=/temporal_vla/data/huggingface
      - PYTHONPATH=/temporal_vla/src/policies/Isaac-GR00T
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    command: ["/bin/bash"]

  # ── VLA Model Services (LeRobot 미지원 모델) ─────────────────────
  # 독립 환경에서 학습/추론. 평가는 robocasa 컨테이너에서 HTTP로 요청.

  xvla:
    container_name: xvla
    build:
      context: ./docker/xvla
      dockerfile: Dockerfile
      args:
        USER_NAME: ${USER_NAME}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    volumes:
      - .:/temporal_vla:rw
      - /D/temporal_vla_data:/D/temporal_vla_data:rw
    environment:
      - HF_HOME=/home/${USER_NAME}/.cache/huggingface
      - HF_TRUST_REMOTE_CODE=1
      - PYTHONPATH=/temporal_vla/lerobot/src:/temporal_vla:/temporal_vla/scripts/utils
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: host
    tty: true
    stdin_open: true
    command: ["/bin/bash"]

  dreamvla:
    container_name: dreamvla
    build:
      context: ./docker/dreamvla
      dockerfile: Dockerfile
      args:
        USER_NAME: ${USER_NAME}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    volumes:
      - .:/temporal_vla:rw
      - /D/temporal_vla_data:/D/temporal_vla_data:rw
      # HF cache 는 NTFS(/D) 가 chmod 미지원 → 호스트 ext4 홈을 직접 bind mount.
      - ${HOME}/.cache/huggingface:/home/${USER_NAME}/.cache/huggingface:rw
    environment:
      - HF_HOME=/home/${USER_NAME}/.cache/huggingface
      - HF_TRUST_REMOTE_CODE=1
      - HF_TOKEN=${HF_TOKEN}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - PYTHONPATH=/temporal_vla/src/policies/dreamvla:/temporal_vla:/temporal_vla/lerobot/src:/temporal_vla/scripts/utils
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: host
    tty: true
    stdin_open: true
    command: ["/bin/bash"]

  calvin:
    container_name: calvin
    build:
      # context must be repo root to access src/benchmarks/calvin submodule during build
      context: .
      dockerfile: ./docker/calvin/Dockerfile
      args:
        USER_NAME: ${USER_NAME}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    volumes:
      - .:/temporal_vla:rw
    environment:
      - HF_HOME=/temporal_vla/data/huggingface
      - PYTHONPATH=/temporal_vla:/temporal_vla/src/benchmarks/calvin
      - PYOPENGL_PLATFORM=egl # headless PyBullet/pyrender via EGL
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: host
    tty: true
    stdin_open: true
    working_dir: /temporal_vla/scripts
    command: ["/bin/bash"]

  openvla_oft:
    container_name: openvla_oft
    build:
      context: ./docker/openvla_oft
      dockerfile: Dockerfile
      args:
        USER_NAME: ${USER_NAME}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    volumes:
      - .:/temporal_vla:rw
      - /D/temporal_vla_data:/D/temporal_vla_data:rw
      # HF cache 는 NTFS(/D) 가 chmod 를 지원 안 해서 호스트 ext4 홈을 직접 bind mount.
      - ${HOME}/.cache/huggingface:/home/${USER_NAME}/.cache/huggingface:rw
    environment:
      - HF_HOME=/home/${USER_NAME}/.cache/huggingface
      - HF_TRUST_REMOTE_CODE=1
      - HF_TOKEN=${HF_TOKEN}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - PYTHONPATH=/temporal_vla/src/policies/openvla-oft:/temporal_vla:/temporal_vla/scripts/utils
      # mujoco/robosuite 의 EGL GPU 렌더링을 위해 NVIDIA driver capabilities 확장.
      # default(compute,utility) 만 있으면 libEGL_nvidia.so 가 컨테이너에 mount 안 됨.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - MUJOCO_GL=egl
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: host
    tty: true
    stdin_open: true
    command: ["/bin/bash"]

  upvla:
    container_name: upvla
    build:
      context: ./docker/upvla
      dockerfile: Dockerfile
      args:
        USER_NAME: ${USER_NAME}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    volumes:
      - .:/temporal_vla:rw
    environment:
      - HF_HOME=/temporal_vla/data/huggingface
      - PYTHONPATH=/temporal_vla/src/policies/UP-VLA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: host
    tty: true
    stdin_open: true
    working_dir: /temporal_vla/scripts
    command: ["/bin/bash"]
